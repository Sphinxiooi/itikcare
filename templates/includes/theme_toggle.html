{% load i18n %}
{% comment %}
Night mode, part 2 of 2: the sidebar switch (base.html). Flips the `dark` class on
<html> that includes/theme_init.html set at page load, and saves the choice. The actual
dark palette is in static/src/input.css ("Night mode" section).
{% endcomment %}
<button type="button" id="theme-toggle" role="switch" aria-checked="false" data-keep-sidebar-open
        class="w-full flex items-center justify-between gap-3 px-4 py-2 rounded-full text-sm font-medium text-gray-700 hover:bg-emerald-50 hover:text-emerald-700 transition-colors">
    <span class="flex items-center gap-3">
        {# Moon icon #}
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/></svg>
        {% translate "Night mode" %}
    </span>
    {# Pill switch; the knob position/colour follow aria-checked via the script below. #}
    <span id="theme-toggle-track" class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full bg-gray-300 transition-colors">
        <span id="theme-toggle-knob" class="inline-block h-4 w-4 translate-x-0.5 rounded-full bg-white shadow transition-transform"></span>
    </span>
</button>
<script>
    (function () {
        var btn = document.getElementById("theme-toggle");
        var track = document.getElementById("theme-toggle-track");
        var knob = document.getElementById("theme-toggle-knob");
        var root = document.documentElement;

        function render() {
            var dark = root.classList.contains("dark");
            btn.setAttribute("aria-checked", dark ? "true" : "false");
            track.classList.toggle("bg-emerald-600", dark);
            track.classList.toggle("bg-gray-300", !dark);
            knob.classList.toggle("translate-x-4", dark);
            knob.classList.toggle("translate-x-0.5", !dark);
        }

        btn.addEventListener("click", function () {
            var dark = !root.classList.contains("dark");
            root.classList.toggle("dark", dark);
            try { localStorage.setItem("itikcare-theme", dark ? "dark" : "light"); } catch (e) {}
            render();
            if (window.itikApplyChartTheme) { window.itikApplyChartTheme(); }
        });
        render();
    })();
</script>
